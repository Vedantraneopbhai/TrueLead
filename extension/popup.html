<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <style>
        body {
            width: 330px;
            padding: 14px;
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
            background: #0f172a;
            color: #f8fafc;
            margin: 0;
            box-sizing: border-box;
        }
        .header {
            font-size: 15px;
            font-weight: 700;
            margin-bottom: 12px;
            color: #38bdf8;
            display: flex;
            align-items: center;
            justify-content: space-between;
        }
        .status-badge {
            font-size: 10px;
            font-weight: 600;
            padding: 2px 6px;
            border-radius: 4px;
            background: rgba(56, 189, 248, 0.15);
            color: #38bdf8;
        }
        textarea {
            width: 100%;
            height: 90px;
            background: rgba(30, 41, 59, 0.9);
            border: 1px solid rgba(255, 255, 255, 0.15);
            border-radius: 8px;
            color: #f8fafc;
            padding: 8px 10px;
            box-sizing: border-box;
            font-size: 12px;
            resize: none;
            margin-bottom: 10px;
            outline: none;
        }
        textarea:focus {
            border-color: #38bdf8;
        }
        button {
            width: 100%;
            padding: 9px;
            background: linear-gradient(135deg, #0284c7 0%, #6366f1 100%);
            border: none;
            border-radius: 8px;
            color: #ffffff;
            font-weight: 600;
            cursor: pointer;
            font-size: 13px;
            transition: opacity 0.2s;
            margin-bottom: 6px;
        }
        button:hover {
            opacity: 0.95;
        }
        .secondary-btn {
            background: rgba(255, 255, 255, 0.1);
            color: #38bdf8;
            display: none;
        }
        .secondary-btn:hover {
            background: rgba(255, 255, 255, 0.18);
        }
        #pop-result {
            margin-top: 12px;
            padding: 10px 12px;
            background: rgba(30, 41, 59, 0.7);
            border-radius: 8px;
            border: 1px solid rgba(255, 255, 255, 0.1);
            display: none;
        }
        .score-header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-bottom: 6px;
        }
        .pop-score {
            font-size: 22px;
            font-weight: 800;
        }
        .pop-tag {
            font-size: 10px;
            font-weight: 700;
            padding: 2px 6px;
            border-radius: 9999px;
            text-transform: uppercase;
        }
        .pop-tag-low { background: rgba(16, 185, 129, 0.2); color: #34d399; }
        .pop-tag-med { background: rgba(245, 158, 11, 0.2); color: #fbbf24; }
        .pop-tag-high { background: rgba(239, 68, 68, 0.2); color: #f87171; }
        .pop-flags {
            font-size: 11px;
            color: #cbd5e1;
            margin-top: 6px;
            border-top: 1px solid rgba(255, 255, 255, 0.08);
            padding-top: 6px;
        }
        .pop-flag-item {
            margin-bottom: 3px;
        }
        .pop-report {
            margin-top: 8px;
            padding-top: 8px;
            border-top: 1px dashed rgba(255, 255, 255, 0.15);
            font-size: 11px;
        }
        .pop-verdict {
            color: #f1f5f9;
            font-weight: 500;
            margin-bottom: 6px;
            line-height: 1.35;
        }
        .pop-rec-item {
            color: #94a3b8;
            margin-bottom: 3px;
        }
    </style>
</head>
<body>
    <div class="header">
        <span>🛡️ TrueLead AI</span>
        <span class="status-badge" id="page-status">Manual Input</span>
    </div>
    
    <div id="manual-section">
        <button id="extract-btn" class="secondary-btn">Extract from Page</button>
        <textarea id="pop-text" placeholder="Paste job offer text, stipend details, or WhatsApp message here..."></textarea>
        <button id="pop-btn">Check Scam Risk</button>
    </div>

    <div id="pop-result">
        <div class="score-header">
            <div>
                <span class="pop-score" id="pop-score-val">0%</span>
                <span style="font-size: 10px; color: #94a3b8;" id="pop-confidence"></span>
            </div>
            <span class="pop-tag" id="pop-tag">LOW</span>
        </div>
        <div class="pop-flags" id="pop-flags"></div>
        <div class="pop-report" id="pop-report" style="display:none;">
            <div class="pop-verdict" id="pop-verdict"></div>
            <div id="pop-recs"></div>
        </div>
    </div>

    <script src="popup.js"></script>
</body>
</html>
