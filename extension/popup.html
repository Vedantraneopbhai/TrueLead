<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <style>
        body {
            width: 320px;
            padding: 16px;
            font-family: 'Segoe UI', system-ui, sans-serif;
            background: #0f172a;
            color: #f8fafc;
            margin: 0;
        }
        h2 {
            font-size: 16px;
            margin: 0 0 12px 0;
            color: #38bdf8;
            display: flex;
            align-items: center;
            gap: 6px;
        }
        textarea {
            width: 100%;
            height: 100px;
            background: rgba(30, 41, 59, 0.8);
            border: 1px solid rgba(255, 255, 255, 0.15);
            border-radius: 8px;
            color: #fff;
            padding: 8px;
            box-sizing: border-box;
            font-size: 12px;
            resize: none;
            margin-bottom: 12px;
        }
        button {
            width: 100%;
            padding: 10px;
            background: linear-gradient(135deg, #38bdf8 0%, #818cf8 100%);
            border: none;
            border-radius: 8px;
            color: #fff;
            font-weight: 600;
            cursor: pointer;
            font-size: 13px;
        }
        #pop-result {
            margin-top: 12px;
            padding: 10px;
            background: rgba(30, 41, 59, 0.6);
            border-radius: 8px;
            display: none;
        }
        .pop-score {
            font-size: 24px;
            font-weight: bold;
        }
    </style>
</head>
<body>
    <h2>🛡️ TrueLead AI Scanner</h2>
    <textarea id="pop-text" placeholder="Paste job offer or WhatsApp message..."></textarea>
    <button id="pop-btn">Scan Job Offer</button>

    <div id="pop-result">
        <div class="pop-score" id="pop-score-val">0%</div>
        <div id="pop-flags" style="font-size: 11px; margin-top: 6px; color: #cbd5e1;"></div>
    </div>

    <script src="popup.js"></script>
</body>
</html>
